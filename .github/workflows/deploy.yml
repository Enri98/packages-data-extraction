# Runs on pushes to main and via manual dispatch.
# Authenticates to GCP using Workload Identity Federation (no long-lived keys),
# then submits a Cloud Build job that builds the container and deploys to Cloud Run.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=infra/cloudbuild.yaml \
            --substitutions=_SHEET_ID=${{ vars.SHEET_ID }},_FOLDER_ID=${{ vars.FOLDER_ID }} \
            --region=us-central1
