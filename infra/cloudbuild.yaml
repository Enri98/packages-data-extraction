# Cloud Build pipeline — builds and pushes the container image.
# Triggered on push to main (configure trigger in GCP console, Session 7).
# Region is us-central1 to stay in the always-free tier.

substitutions:
  _REGION: us-central1
  _REPO: fustelle-extractor       # Artifact Registry repository name
  _SERVICE: fustelle-extractor    # Cloud Run service name
  # Required at deploy-time. Override via:
  #   gcloud builds submit --substitutions=_SHEET_ID=...,_FOLDER_ID=...
  # Build will FAIL if these are left at the placeholder default — that is
  # intentional: missing them in production silently breaks every Sheet write.
  _SHEET_ID: REQUIRED_SET_VIA_SUBSTITUTION
  _FOLDER_ID: REQUIRED_SET_VIA_SUBSTITUTION

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - infra/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated   # Apps Script OIDC; Cloud Run validates ID token
      - --service-account=docsprocess-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1         # serial processing; no concurrent writes to Sheet
      - --concurrency=1           # one request at a time per instance
      - --timeout=300s
      - --update-env-vars=GEMINI_LIVE=1,LOG_LEVEL=INFO,GOOGLE_SHEET_ID=${_SHEET_ID},GOOGLE_DRIVE_FOLDER_ID=${_FOLDER_ID}
      - --update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
