[project]
name = "fustelle-extractor"
version = "0.1.0"
description = "Extracts structured data from product packaging PDFs into Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "google-genai>=0.8",
    "pydantic>=2.9",
    "gspread>=6.0",
    "tenacity>=8.0",
    "loguru>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "httpx>=0.27",          # Drive file download in server mode
    "google-auth>=2.0",     # service account credentials for Drive download
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "vcrpy>=6.0",           # cassette fixtures for VLM tests
    "pytest-httpx>=0.30",   # mock HTTP in server tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
